<!doctype html>
<html lang="ko" style="background-color: #f8fafc; color: #0f172a; color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KCP 자재관리시스템 (WMA)</title>
    <meta name="description" content="KCP 자재관리시스템 (Warehouse Material Application) 모바일 검수 및 실시간 입고 시스템" />
    
    <!-- App Icons & Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/wma-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    
    <!-- Force Light Theme in all Mobile & Desktop Browsers -->
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-navbutton-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KCP WMA" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="KCP QR 자재입고 시스템" />
    <meta property="og:description" content="QR코드 기반 납품확인서 실시간 검수 및 입고처리 시스템" />
    <meta property="og:type" content="website" />

    <!-- Typography (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body style="background-color: #f8fafc; color: #0f172a; color-scheme: light;" class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900 min-h-screen">
    <div id="root" style="background-color: #f8fafc; color: #0f172a; color-scheme: light;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] ServiceWorker registered:', reg.scope))
            .catch((err) => console.warn('[PWA] ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
